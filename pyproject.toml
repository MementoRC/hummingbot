[tool.pixi.tasks]
test-changed = "python3 .github/test-selection/select_tests.py --mode branch --base-ref origin/ci-base --head-ref HEAD --config .github/test-selection/test-selection-map.yaml --repo . --no-history > /tmp/selected_tests.txt && pixi run -e ci pytest $(cat /tmp/selected_tests.txt) -v --tb=short"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 120
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[build-system]
requires = ["setuptools", "wheel", "numpy>=2.2.6", "cython>=3.0.12"]
build-backend = "setuptools.build_meta"

[tool.isort]
line_length = 120
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
ensure_newline_before_comments = true
combine_as_imports = true
conda_env = "hummingbot"
filter_files = true
skip = ["setup.py"]

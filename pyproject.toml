[project]
name = "hummingbot"
version = "20261118"
description = "Hummingbot"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Hummingbot Foundation", email = "dev@hummingbot.org" }]
requires-python = ">=3.12,<3.14" # pandas-ta>=0.4.71b0 (pinned below) needs >=3.12; <3.14 is untested
# Runtime dependencies are conda packages under [tool.pixi.dependencies] below; upstream's PyPI
# `dependencies = [...]` list is intentionally omitted here (pixi would resolve it as PyPI deps and
# clash with the conda solve, e.g. decibel-python-sdk needs httpx>=0.28 vs conda's 0.24).

[project.urls]
Homepage = "https://github.com/hummingbot/hummingbot"

[project.scripts]
hummingbot = "bin.hummingbot_quickstart:main"

[project.optional-dependencies]
# Extra packages for the dYdX v4 build (`make install DYDX=1`), on top of the base dependencies.
# (environment_dydx.yml also pinned "backports>=1.0" — dropped: nothing in the codebase imports
# it directly, and it has no release compatible with every Python this project's requires-python
# permits, which made dependency resolution unsatisfiable.)
dydx = [
    "v4-proto", # conda-forge packaged this same project as "dydxprotocol-v4-proto-py"; PyPI's name is "v4-proto" (import name: v4_proto)
    "gql[aiohttp]>=3.4.1", # conda-forge split gql's aiohttp transport into "gql-with-aiohttp"; PyPI's equivalent is the gql[aiohttp] extra
    # v4-proto's own metadata only declares "protobuf>=4.23", far below the gencode version its
    # wheel is actually compiled against -- resolving the base "protobuf>=4.23.3" dependency
    # without this floor picks an older runtime (seen: 5.29.6) that protobuf's own gencode/runtime
    # check then refuses at import time ("Detected incompatible Protobuf Gencode/Runtime
    # versions ... gencode 6.31.1 runtime 5.29.6"). Declaring the floor directly in this extra (not
    # in the base dependency, which would wrongly also apply to the "injective" extra's own
    # protobuf<6.0.0 ceiling) lets uv fork the two extras onto their own compatible protobuf
    # version instead of colliding on one.
    "protobuf>=6.31.1",
]
# Extra packages for the injective_v2 connectors (`make install INJECTIVE=1`). injective-py
# bundles its own compiled copy of the Cosmos SDK's protobuf files under a different name than
# v4-proto's copy of those same proto definitions; importing both in one process trips protobuf's
# global descriptor pool ("a file with that name has already been added to this registry"), which
# is what broke the dYdX connector when injective-py was still an unconditional base dependency.
# Keeping injective-py behind its own extra, mutually exclusive with "dydx" (see
# [tool.uv].conflicts below), means only one of the two colliding proto copies is ever installed.
injective = [
    "injective-py==1.14.*",
]

[tool.uv]
# This project builds its own Cython extensions in place via `setup.py build_ext` (see
# Makefile/install), not through a wheel/editable install — uv should only manage the
# dependency venv, the same division of labor conda had between `conda env create` and
# the separate `setup.py build_ext --inplace` step.
package = false
# injective-py (extra "injective") and v4-proto (extra "dydx") bundle colliding compiled copies
# of the same Cosmos protobuf files (see the "injective" extra's comment above) — never let uv
# resolve or sync both extras into the same environment at once.
conflicts = [
    [
        { extra = "dydx" },
        { extra = "injective" },
    ],
]
# The Makefile/install/start scripts are bash-only (no native Windows support, same as the old
# conda-based flow), and at least one dydx-extra dependency has no Windows distribution on PyPI
# (conda-forge built its own). Scope universal resolution to the platforms actually supported.
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]
# bip32==5.0.0 (pulled in transitively by injective-py) caps coincurve<21; coincurve<21 ships no
# prebuilt wheel for Python>=3.12, forcing a source build whose own build-system pin is unbounded
# and picks up a scikit-build-core that broke backward compat with coincurve's pyproject.toml,
# failing before the build starts. bip32 is unmaintained (5.0.0 is 3+ years old) and its only use
# of coincurve is the same secp256k1 FFI surface coincurve>=21 still exposes, so force the newer,
# wheel-having version rather than waiting on a fix that likely isn't coming.
override-dependencies = ["coincurve>=21.0.0"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
asyncio_mode = "auto"
# Fail any single test that runs longer than this (seconds) instead of hanging the
# whole CI run. Uses the SIGALRM-based method so a timed-out test raises in the main
# thread and the suite continues, surfacing every real failure in one run.
timeout = 120
timeout_method = "signal"

[tool.black]
line-length = 120
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[build-system]
requires = ["setuptools==80.8.0", "wheel", "numpy>=2.2.6", "cython>=3.0.12"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hummingbot", "hummingbot.*"]
exclude = [
    "hummingbot.connector.gateway.clob_spot.data_sources.injective",
    "hummingbot.connector.gateway.clob_perp.data_sources.injective_perpetual",
]

[tool.setuptools.package-data]
hummingbot = ["core/cpp/*", "VERSION", "templates/*TEMPLATE.yml"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]
[tool.pixi.dependencies]
# Build/install
python = ">=3.10.12,<3.13"
cython = ">=3.0.12"
hatchling = ">=1.29.0"
maturin = ">=1.5"
pip = ">=23.2.1"
setuptools = ">=80.8.0"
wheel = ">=0.37.0"
# Core runtime
aiohttp = ">=3.8.5"
aiomqtt = ">=2.0.0"
aioprocessing = ">=2.0.1"
aioresponses = ">=0.7.4"
aiounittest = ">=1.4.2"
async-timeout = ">=4.0.2,<5"
asyncssh = ">=2.13.2"
base58 = ">=2.1.1"
bidict = ">=0.22.1"
bip-utils = "*"
cachetools = ">=5.3.1"
cryptography = ">=41.0.2"
eth-account = ">=0.13.0"
injective-py = ">=1.12"
libta-lib = ">=0.6.4"
msgpack-python = "*"
numba = "==0.61.2"
numpy = ">=2.2.6"
objgraph = "*"
pandas = ">=2.3.2"
pandas-ta = ">=0.4.71b"
prompt_toolkit = ">=3.0.39"
protobuf = ">=4.23.3"
psutil = ">=5.9.5"
ptpython = ">=3.0.26"
pydantic = ">=2"
pyjwt = ">=2.3.0"
pyperclip = ">=1.8.2"
pyyaml = ">=6.0"
requests = ">=2.31.0"
"ruamel.yaml" = ">=0.2.5"
rust = "*"
safe-pysha3 = "*"
solders = ">=0.27"
scalecodec = ">=1.2"
scipy = ">=1.11.1"
six = ">=1.16.0"
sqlalchemy = ">=1.4.49"
ta-lib = ">=0.6.4"
tabulate = "==0.9.0"
tqdm = ">=4.67.1"
typer = ">=0.9.0"
ujson = ">=5.7.0"
urllib3 = ">=1.26.15,<2.0"
web3 = "*"
xrpl-py = "==4.4.0"
zlib = ">=1.2.13"

[tool.pixi.feature.dev.dependencies]
pytest = ">=7.4.0"
pytest-asyncio = ">=0.16.0"
pytest-cov = "*"
pytest-mock = "*"
pytest-timeout = ">=2.1.0"
coverage = ">=7.2.7"
diff-cover = ">=7.7.0"
ruff = "==0.15.7"
mypy = "*"
pre-commit = ">=3.3.3"
cython-lint = "*"

[tool.pixi.feature.ci.dependencies]
bandit = "*"
pip-audit = "*"
types-setuptools = "*"
pytest-xdist = ">=3,<4"

[tool.pixi.feature.dev.pypi-dependencies]
import-linter = ">=2.0"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
ci = { features = ["ci", "dev"], solve-group = "default" }
# py310/py311/py312 removed: pandas-ta/numba version conflicts

[tool.pixi.tasks]
# Sub-package editable install. HUMMINGBOT_SKIP_CYTHON=1 skips Cython compilation during pip install -e (sub-packages don't ship Cython extensions).
install-subpackages = { cmd = "python -m pip install --no-deps --no-build-isolation -e sub-packages/async-utils -e sub-packages/candles-feed -e sub-packages/connector-utils -e sub-packages/data-type-primitives -e sub-packages/event-bus -e sub-packages/liquidations-feed -e sub-packages/logger -e sub-packages/market-connector -e sub-packages/market-data -e sub-packages/market-simulator -e sub-packages/rate-oracle -e sub-packages/remote-iface -e sub-packages/strategy-framework -e sub-packages/user-stream-tracker -e sub-packages/web-assistant", env = { HUMMINGBOT_SKIP_CYTHON = "1" } }
install-dev = { depends-on = ["install-subpackages"], cmd = "python -m pip install --no-deps --no-build-isolation -e ." }
build = { cmd = "python setup.py build_ext --inplace", depends-on = ["install-dev"] }
rust-build = { cmd = "maturin develop --manifest-path hummingbot/rust/Cargo.toml", depends-on = ["install-dev"] }
test = { cmd = "pytest test", depends-on = ["build"] }
test-unit = { cmd = "pytest test/hummingbot", depends-on = ["build"] }
test-fast = "pytest --timeout=30 --tb=short -q"
lint = "ruff check hummingbot test controllers scripts bin"
lint-boundaries = "lint-imports"
lint-cython = "cython-lint hummingbot"
format = { cmd = "ruff format hummingbot test controllers scripts bin" }
format-check = "ruff format --check hummingbot test controllers scripts bin"
type-check = "mypy hummingbot"
security-scan = "bandit -c pyproject.toml -r hummingbot/"
dependency-scan = { cmd = "pip-audit --strict --desc on", depends-on = ["install-dev"] }
quality-gate = { depends-on = ["quality", "type-check"] }
quality = { depends-on = ["lint", "format-check"] }
check = { depends-on = ["quality", "test"] }
hooks-install = "pre-commit install"
submodule-update = "git submodule update --remote sub-packages/candles-feed"
compat-import = { cmd = "python ci/check_subpackage_compat.py import", depends-on = ["install-dev"] }
compat-contract = { cmd = "python ci/check_subpackage_compat.py contract", depends-on = ["install-dev"] }
compat-integration = { cmd = "pytest sub-packages/candles-feed/tests/unit/test_compatibility.py sub-packages/candles-feed/tests/unit/test_hummingbot_integration.py -v --timeout=30", depends-on = ["install-dev"] }
compat-check = { depends-on = ["compat-import", "compat-contract", "compat-integration"], description = "Run compat checks across all 14 sub-packages" }
migrate-pytest = { cmd = "python $HOME/PycharmProjects/refactor-applications/refactor/rules/pytest_migration.py -d --apply --verbose test/", env = { PYTHONPATH = "$HOME/PycharmProjects/refactor-applications:$PYTHONPATH" } }
migrate-pytest-dry = { cmd = "python $HOME/PycharmProjects/refactor-applications/refactor/rules/pytest_migration.py -d --verbose test/", env = { PYTHONPATH = "$HOME/PycharmProjects/refactor-applications:$PYTHONPATH" } }

[tool.ruff]
line-length = 120
target-version = "py312"
include = ["hummingbot/**/*.py", "hummingbot/**/*.pyi", "test/**/*.py", "controllers/**/*.py", "scripts/**/*.py", "bin/**/*.py", "bin/hbot"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E251", "E501", "E702"]
external = ["mock"]

[tool.ruff.lint.isort]
known-first-party = ["hummingbot"]
force-sort-within-sections = true
combine-as-imports = true
force-single-line = false

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
ignore_missing_imports = true
follow_imports = "silent"
disallow_untyped_defs = false
check_untyped_defs = false
exclude = [
    "hummingbot/connector/gateway",
    "hummingbot/connector/derivative/injective_v2",
    "hummingbot/core/cpp",
]

[tool.bandit]
skips = [
    "B101",  # assert used — standard in trading logic
    "B110",  # try-except-pass — common async pattern
    "B311",  # random — not used for crypto keys
    "B324",  # hashlib — used for API signatures, not passwords
    "B404",  # import_subprocess — flagged by importing subprocess
    "B603",  # subprocess_without_shell_equals_true
    "B607",  # start_process_with_partial_path
    "B105",  # hardcoded_password_string — false positives on config defaults
    "B106",  # hardcoded_password_funcarg — false positives on config defaults
    "B107",  # hardcoded_password_default — false positives ("USDT" as default)
    "B112",  # try_except_continue — common async pattern
    "B608",  # hardcoded_sql_expressions — local SQLite, not user-facing
]

[tool.cython-lint]
max-line-length = 999

[tool.coverage.run]
source_pkgs = ["hummingbot"]
branch = true
dynamic_context = "test_function"
omit = [
    "hummingbot/core/gateway/*",
    "hummingbot/core/management/*",
    "hummingbot/client/config/config_helpers.py",
    "hummingbot/client/config/conf_migration.py",
    "hummingbot/client/config/security.py",
    "hummingbot/client/hummingbot_application.py",
    "hummingbot/client/command/*",
    "hummingbot/client/settings.py",
    "hummingbot/client/ui/completer.py",
    "hummingbot/client/ui/layout.py",
    "hummingbot/client/tab/*",
    "hummingbot/client/ui/parser.py",
    "hummingbot/connector/derivative/position.py",
    "hummingbot/connector/derivative/dydx_v4_perpetual/*",
    "hummingbot/connector/derivative/dydx_v4_perpetual/data_sources/*",
    "hummingbot/connector/exchange/injective_v2/account_delegation_script.py",
    "hummingbot/connector/exchange/mexc/protobuf/*",
    "hummingbot/connector/exchange/paper_trade*",
    "hummingbot/connector/gateway/**",
    "hummingbot/connector/test_support/*",
    "hummingbot/core/utils/gateway_config_utils.py",
    "hummingbot/core/utils/kill_switch.py",
    "hummingbot/core/utils/wallet_setup.py",
    "hummingbot/connector/mock*",
    "hummingbot/strategy/*/start.py",
    "hummingbot/strategy/dev*",
    "hummingbot/user/user_balances.py",
    "hummingbot/connector/exchange/cube/cube_ws_protobufs/*",
    "hummingbot/connector/exchange/ndax/*",
    "hummingbot/strategy/amm_arb/*",
    "hummingbot/strategy_v2/backtesting/*",
]

[tool.coverage.report]
fail_under = 70
precision = 2
skip_empty = true
exclude_lines = [
    "@(abc\\.)?abstractmethod",
    "if TYPE_CHECKING:",
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if 0:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if settings.DEBUG",
    "except asyncio.exceptions.TimeoutError:",
]

[tool.coverage.html]
directory = "coverage_html_report"
show_contexts = true

[tool.coverage.xml]
output = "coverage.xml"
